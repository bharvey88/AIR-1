substitutions:
  name: apollo-air-1
  version: "26.3.2.1"
  device_description: ${name} made by Apollo Automation - version ${version}.

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

api:
  on_client_connected:
    - delay: 90s
    - if:
        condition:
          or:
            - binary_sensor.is_on: ota_mode
            - switch.is_on: prevent_sleep
        then:
          - lambda: |- 
              ESP_LOGW("Apollo", "Preventing Deep Sleep Due To OTA Or Switch");
              id(deep_sleep_1).prevent_deep_sleep(); 
        else:
          - lambda: |-
              id(reportAllValues).execute();
          - deep_sleep.enter:
              id: deep_sleep_1
  actions:
    #Co2 Calibration Action
    - action: calibrate_co2_value
      variables:
        co2_ppm: float
      then:
        - scd4x.perform_forced_calibration:
            value: !lambda "return co2_ppm;"
            id: scd40
    - action: sen55_clean
      then:
        - sen5x.start_fan_autoclean: sen55
  reboot_timeout: 0s

captive_portal:

web_server:
  port: 80
  version: 3

globals:
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'
  - id: button_press_timestamp
    restore_value: no
    type: uint32_t
    initial_value: '0'
  - id: runTest
    restore_value: yes
    type: bool
    initial_value: "true"
  - id: testCycleCount
    type: int
    restore_value: no
    initial_value: "0"
  - id: dps310Passed
    restore_value: no
    type: bool
    initial_value: "false"


i2c:
  sda: GPIO1
  scl: GPIO0
  id: bus_a

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 5min
  run_duration: 2min

number:
  - platform: template
    name: SEN55 Temperature Offset
    id: sen55_temperature_offset
    restore_value: true
    initial_value: 6.0
    min_value: -70.0
    max_value: 70.0
    entity_category: "CONFIG"
    unit_of_measurement: "°C"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: SEN55 Humidity Offset
    id: sen55_humidity_offset
    restore_value: true
    initial_value: 0
    min_value: -70.0
    max_value: 70.0
    entity_category: "CONFIG"
    unit_of_measurement: "%"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box
  - platform: template
    name: "DPS310 Pressure Offset"
    id: dps310_pressure_offset
    disabled_by_default: true
    restore_value: true
    initial_value: 0.0
    min_value: -100.0
    max_value: 100.0
    entity_category: "CONFIG"
    unit_of_measurement: "hPa"
    optimistic: true
    update_interval: never
    step: 0.1
    mode: box

  - platform: template
    name: "SEN55 K Coefficient"
    id: sen55_k_coefficient
    restore_value: true
    initial_value: 0.535
    min_value: 0.0
    max_value: 2.0
    entity_category: "CONFIG"
    optimistic: true
    update_interval: never
    step: 0.001
    mode: box

  - platform: template
    name: "SEN55 J Coefficient"
    id: sen55_j_coefficient
    restore_value: true
    initial_value: 0.231
    min_value: 0.0
    max_value: 2.0
    entity_category: "CONFIG"
    optimistic: true
    update_interval: never
    step: 0.001
    mode: box

  - platform: template
    name: "Sleep Duration"
    id: deep_sleep_sleep_duration
    min_value: 0
    max_value: 800
    step: 1
    mode: box
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 5
    icon: "mdi:arrow-collapse-right"
    entity_category: CONFIG
    unit_of_measurement: "min"
    on_value:
      then:
        - lambda: |-
            id(deep_sleep_1).set_sleep_duration(x * 60 * 1000);
    

binary_sensor:
  - platform: status
    name: Online
    id: ink_ha_connected
  - platform: gpio
    pin: 
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    id: reset_button  
    on_press:
      then:
        - lambda: |-
            id(button_press_timestamp) = millis();    
    on_release:
      then:
        - lambda: |-
            if (millis() - id(button_press_timestamp) >= 10000) {
              id(prevent_sleep).turn_on();
              id(factory_reset_switch).turn_on();
            }
            else if (millis() - id(button_press_timestamp) >= 3000) {
              //Turn Prevent Sleep On
              id(prevent_sleep).turn_on();
              //Prevent Sleep
              id(deep_sleep_1).prevent_deep_sleep();
            }
            else {
              // StatusCheck
              id(statusCheck).execute();
              delay(3000);
              id(testCycleCount) = 0;
              id(runTest) = true;
              id(testScript).execute();
            }
  - platform: homeassistant
    name: "OTA Mode"
    id: ota_mode
    entity_id: input_boolean.apollo_ota_mode
    on_press:
      then:
        - lambda: |- 
            id(deep_sleep_1).prevent_deep_sleep();
    on_release:  
      then:
        - if:
            condition:
              switch.is_off: prevent_sleep
            then:
              - lambda: |- 
                  id(deep_sleep_1).allow_deep_sleep();

sensor:
  - platform: internal_temperature
    name: "ESP Temperature"
    id: sys_esp_temperature

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: scd4x
    id: scd40
    co2:
      name: "CO2"
      id: "co2"
    temperature:
      name: "SCD40 Temperature"
      id: scd40temperature
      accuracy_decimals: 2
    humidity:
      name: "SCD40 Humidity"
      id: scd40humidity
      accuracy_decimals: 1
    automatic_self_calibration: false
    update_interval: 60s
    measurement_mode: "periodic"
    i2c_id: bus_a
    ambient_pressure_compensation_source: dps310pressure

  - platform: dps310
    id: dps_310
    pressure:
      name: "DPS310 Pressure"
      id: dps310pressure
      filters:
        - lambda: |-
            float offset = id(dps310_pressure_offset).state;
            return isnan(offset) ? x : x + offset;
    temperature:
      name: "DPS310 Temperature"
      id: dps310temperature
      accuracy_decimals: 2
    update_interval: 30s
    i2c_id: bus_a

  - platform: sen5x
    id: sen55
    pm_1_0:
      name: "PM <1µm Weight concentration"
      id: pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: "PM <2.5µm Weight concentration"
      id: pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: "PM <4µm Weight concentration"
      id: pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: "PM <10µm Weight concentration"
      id: pm_10_0
      accuracy_decimals: 1
    temperature:
      name: "SEN55 Temperature"
      id: sen55_temperature
      filters:
        - lambda: return x - id(sen55_temperature_offset).state;
      accuracy_decimals: 1
    humidity:
      name: "SEN55 Humidity"
      id: sen55_humidity
      filters:
        - lambda: return x - id(sen55_humidity_offset).state;
      accuracy_decimals: 1
    voc:
      name: "SEN55 VOC"
      id: sen55_voc
      
      algorithm_tuning:
        #https://sensirion.com/media/documents/25AB572C/62B463AA/Sensirion_Engineering_Guidelines_SEN5x.pdf
        index_offset: 100
        learning_time_offset_hours: 72
        learning_time_gain_hours: 72
        gating_max_duration_minutes: 180
        std_initial: 50
        gain_factor: 230
    nox:
      name: "SEN55 NOX"
      id: sen55_nox
    acceleration_mode: low
    store_baseline: true
    address: 0x69
    update_interval: 10s

  - platform: template
    name: "SEN55 Corrected Temperature"
    id: sen55_corrected_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      // Dynamic self-heating correction for SEN55 temperature.
      // Uses DPS310 and SCD40 temperatures as cooler thermal references
      // to estimate SEN55 self-heating error.
      // Formula: corrected = raw - (0.72*k*(dps-raw) + 0.28*j*(scd-raw))
      // Requires sen55_temperature_offset = 0 and Prevent Sleep = on for
      // meaningful results (algorithm needs thermal steady state).
      float sen_published = id(sen55_temperature).state;
      float static_offset = id(sen55_temperature_offset).state;
      float raw = sen_published + (isnan(static_offset) ? 0.0f : static_offset);

      float dps = id(dps310temperature).state;
      float scd = id(scd40temperature).state;

      if (isnan(raw) || isnan(dps) || isnan(scd)) {
        return NAN;
      }

      float grad_dps = dps - raw;
      if (grad_dps < 0.5f) {
        // Insufficient thermal gradient - ESP32 not warmed up enough
        return raw;
      }

      float grad_scd = scd - raw;
      float k = id(sen55_k_coefficient).state;
      float j = id(sen55_j_coefficient).state;
      float correction = 0.72f * k * grad_dps + 0.28f * j * grad_scd;

      return raw - correction;

  - platform: template
    name: "SEN55 Corrected Humidity"
    id: sen55_corrected_humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      // Corrects SEN55 relative humidity for self-heating using the Magnus
      // formula for saturation vapor pressure. A sensor sitting above room
      // temperature reads lower RH than the actual room air, because the
      // same absolute water content maps to lower RH at higher temperature.
      //   RH_corrected = RH_raw * P_sat(T_sensor) / P_sat(T_room)
      //   P_sat(T) = 6.112 * exp(17.62*T / (243.12 + T))
      float hum_published = id(sen55_humidity).state;
      float hum_offset = id(sen55_humidity_offset).state;
      float raw_hum = hum_published + (isnan(hum_offset) ? 0.0f : hum_offset);

      float temp_published = id(sen55_temperature).state;
      float temp_offset = id(sen55_temperature_offset).state;
      float raw_temp = temp_published + (isnan(temp_offset) ? 0.0f : temp_offset);

      float corrected_temp = id(sen55_corrected_temperature).state;

      if (isnan(raw_hum) || isnan(raw_temp) || isnan(corrected_temp)) {
        return NAN;
      }

      float p_sat_sensor = 6.112f * expf(17.62f * raw_temp / (243.12f + raw_temp));
      float p_sat_room = 6.112f * expf(17.62f * corrected_temp / (243.12f + corrected_temp));

      float corrected = raw_hum * p_sat_sensor / p_sat_room;

      if (corrected > 100.0f) corrected = 100.0f;
      if (corrected < 0.0f) corrected = 0.0f;
      return corrected;

  - platform: template
    name: "SCD40 Corrected Humidity"
    id: scd40_corrected_humidity
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      // Same Magnus-formula correction applied to SCD40 humidity. Uses the
      // corrected SEN55 temperature as the "true ambient" reference, on the
      // assumption that air inside the Air-1 case is well-mixed and both
      // sensors see the same absolute water content.
      float raw_hum = id(scd40humidity).state;
      float raw_temp = id(scd40temperature).state;
      float room_temp = id(sen55_corrected_temperature).state;

      if (isnan(raw_hum) || isnan(raw_temp) || isnan(room_temp)) {
        return NAN;
      }

      float p_sat_sensor = 6.112f * expf(17.62f * raw_temp / (243.12f + raw_temp));
      float p_sat_room = 6.112f * expf(17.62f * room_temp / (243.12f + room_temp));

      float corrected = raw_hum * p_sat_sensor / p_sat_room;

      if (corrected > 100.0f) corrected = 100.0f;
      if (corrected < 0.0f) corrected = 0.0f;
      return corrected;

  - platform: template
    name: "PM 0.3 To 1 µm"
    id: pm0_3_to_1
    disabled_by_default: true
    lambda: return id(pm_1_0).state;
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s
  
  - platform: template
    name: "PM 1 To 2.5 µm"
    id: pm1_to_2_5
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_2_5).state - id(pm_1_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s
  
  - platform: template
    name: "PM 2.5 To 4 µm"
    id: pm2_5_to_4
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_4_0).state - id(pm_2_5).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: template
    name: "PM 4 To 10 µm"
    id: pm4_to_10
    disabled_by_default: true
    lambda: return std::max(0.0f, id(pm_10_0).state - id(pm_4_0).state);
    unit_of_measurement: "µg/m³"
    state_class: measurement
    icon: mdi:air-filter
    update_interval: 10s

  - platform: aqi
    name: "NowCast AQI"
    id: nowcast_aqi
    pm_2_5: pm_2_5
    pm_10_0: pm_10_0
    calculation_type: AQI
    device_class: aqi

  - platform: mics_4514
    id: mics4514
    nitrogen_dioxide:
      name: Nitrogen Dioxide
      id: nitrogen_dioxide
    carbon_monoxide:
      name: Carbon Monoxide
      id: carbon_monoxide
    hydrogen:
      name: Hydrogen
      id: hydrogen
    ethanol:
      name: Ethanol
      id: ethanol
    methane:
      name: Methane
      id: methane
    ammonia:
      name: Ammonia
      id: ammonia
    update_interval: 60s

light:
  - platform: esp32_rmt_led_strip
    id: rgb_light
    name: "RGB Light"
    pin: GPIO3
    default_transition_length: 0s
    chipset: WS2812
    num_leds: 3
    rgb_order: grb
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

  - platform: factory_reset
    disabled_by_default: True
    name: "Factory Reset ESP"
    id: factory_reset_all

  - platform: template
    name: "Calibrate SCD40 To 420ppm"
    id: set_SCD40_calibrate
    on_press:
      - scd4x.perform_forced_calibration:
          value: 420
          id: scd40

  - platform: template
    name: "Clean SEN55"
    id: clean_sen55
    on_press:
      - sen5x.start_fan_autoclean: sen55

text_sensor:
    # Convert VOC Index To Text: 
    # https://sensirion.com/media/documents/02232963/6294E043/Info_Note_VOC_Index.pdf
    # https://sensirion.com/media/documents/ACD82D45/6294DFC0/Info_Note_Integration_VOC_NOx_Sensor.pdf
  - platform: template
    name: "VOC Quality"
    id: voc_quality
    icon: mdi:air-filter
    lambda: |-
      if (id(sen55_voc).state < 80) {
        return std::string("Improved");} 
      else if (id(sen55_voc).state < 150) {
        return std::string("Normal");} 
      else if (id(sen55_voc).state < 250) {
        return std::string("Abnormal");} 
      else if (id(sen55_voc).state < 400) {
        return std::string("Very abnormal");} 
      else if (id(sen55_voc).state >= 400) {
        return std::string("Extremely abnormal");}
      else {
        return std::string("Unknown");}

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: wifi_ip
      entity_category: "diagnostic"
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: "diagnostic"
  - platform: template
    name: "Apollo Firmware Version"
    id: apollo_firmware_version
    update_interval: never
    entity_category: "diagnostic"

switch:
  - platform: factory_reset
    id: factory_reset_switch
    internal: true

  - platform: template
    name: "Prevent Sleep"
    id: prevent_sleep
    icon: mdi:sleep
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      then:
        - lambda: |- 
            id(deep_sleep_1).prevent_deep_sleep();
    on_turn_off:
      then:
        - if:
            condition:
              binary_sensor.is_off: ota_mode
            then:
              - lambda: |- 
                  id(deep_sleep_1).allow_deep_sleep();

script:
  - id: testScript      
    then:
      if: 
        condition:
          - lambda: "return id(runTest) == true;"
        then:
          - lambda: "id(runTest) = false;"
          - lambda: "id(testCycleCount) = 0;"
          - while:
              condition:
                - lambda: "return id(testCycleCount) < 5;"
              then:
                - if:
                    condition:
                      - lambda: "return id(dps310Passed) == false;"
                    then:
                      - if:
                          condition:
                            - lambda: "return id(dps310pressure).state > 800 && id(dps310pressure).state < 1200;"
                          then:
                            - lambda: "id(dps310Passed) = true;"
              
                - if:
                    condition:
                      - lambda: "return id(dps310Passed);"
                    then:
                      - lambda: "id(testCycleCount) = 10;"
                - lambda: "id(runTest) = false;"
                - delay: 1s
                - lambda: "id(testCycleCount) += 1;"
          
          #Check If Test Passed To Trigger Lights
          - if:
              condition:
                - lambda: "return id(dps310Passed);"
              then:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 100%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light
                
              else:
                - lambda: "id(runTest) = false;"
                - light.turn_on:
                    id: rgb_light
                    red: 100%
                    green: 0%
                    blue: 0%
                - delay: 5s
                - light.turn_on:
                    id: rgb_light
                    red: 0%
                    green: 0%
                    blue: 0%
                - light.turn_off:
                    id: rgb_light

  - id: statusCheck
    then:
      - if:
          condition:
            - lambda: 'return id(ink_ha_connected).state;'
          then:
            - logger.log: "Apollo Automation: Connected To HA"
            - light.turn_on: 
                id: rgb_light
                brightness: 100%
                red: 0%
                green: 0%
                blue: 100%
          else:
            - if:
                condition:
                  - wifi.connected
                then:
                  - logger.log: "Apollo Automation: Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 100%
                      red: 0%
                      green: 100%
                      blue: 0%
                else:
                  - logger.log: "Apollo Automation: Not Connected To Wifi"
                  - light.turn_on: 
                      id: rgb_light
                      brightness: 100%
                      red: 100%
                      green: 100%
                      blue: 0%
      - delay: 5s
      - light.turn_off: rgb_light
  - id: reportAllValues
    then:
      - component.update: sen55
      - component.update: mics4514
      - component.update: dps_310
      - component.update: scd40
      - component.update: wifi_signal_db
      - component.update: sys_esp_temperature
      - component.update: sys_uptime
      - component.update: pm0_3_to_1
      - component.update: pm1_to_2_5
      - component.update: pm2_5_to_4
      - component.update: pm4_to_10
      - component.update: voc_quality
      - component.update: sen55_corrected_temperature
      - component.update: sen55_corrected_humidity
      - component.update: scd40_corrected_humidity
